# =============================================================================
# Demo messaging rules — single source of truth for topics, groups, and users.
# Loaded via spring.config.import in application.yml.
# Change group names / user↔group mapping here; restart the app to apply.
# =============================================================================

messaging:
  topics:
    taskQueue: task-queue-topic
    broadcast: broadcast-topic
    orderEvents: order-events-topic

  partitions:
    taskQueue: 3
    broadcast: 3
    orderEvents: 3

  groups:
    # Work queue: E1 and E2 share this group → compete (one task → one worker)
    worker: worker-group
    # Fanout: different groups → each gets a full copy
    analytics: group-analytics
    notifications: group-notifications
    # Live projection (OrderStateStore)
    orderLive: order-events-live-group
    # D / D1 / D2 each have their own group → each sees every NUMBER event
    orderPull:
      d: demo-order-pull-d
      d1: demo-order-pull-d1
      d2: demo-order-pull-d2
    # Prefix for disposable replay consumers (UUID is appended in code)
    orderReplayPrefix: order-events-replay-

  # Who is producer/consumer and which group / delivery they use
  users:
    A:
      role: producer
      pattern: fanout
      page: /rabbit-a.html
    B:
      role: consumer
      pattern: fanout
      delivery: push
      group: notifications
      page: /rabbit-b.html
    B1:
      role: consumer
      pattern: fanout
      delivery: push
      group: notifications
      page: /rabbit-b1.html
    B2:
      role: consumer
      pattern: fanout
      delivery: push
      group: notifications
      page: /rabbit-b2.html
    C:
      role: producer
      pattern: event-log
      page: /kafka-c.html
    D:
      role: consumer
      pattern: event-log
      delivery: pull
      inbox: d
      page: /kafka-d.html
    D1:
      role: consumer
      pattern: event-log
      delivery: pull
      inbox: d1
      page: /kafka-d1.html
    D2:
      role: consumer
      pattern: event-log
      delivery: pull
      inbox: d2
      page: /kafka-d2.html
    F:
      role: producer
      pattern: work-queue
      page: /queue-f.html
    E1:
      role: consumer
      pattern: work-queue
      delivery: push
      group: worker
      worker: worker-instance-1
      page: /queue-e1.html
    E2:
      role: consumer
      pattern: work-queue
      delivery: pull
      group: worker
      worker: worker-instance-2
      page: /queue-e2.html
