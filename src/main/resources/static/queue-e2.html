<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User E2 — Pull</title>
  <link rel="stylesheet" href="/css/demo.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge kafka">Work queue · Pull · worker-instance-2</span>
      <h1>User E2</h1>
      <p>Pull tasks handled by worker-instance-2 only. E1 will not get the same task.</p>
    </header>
    <section class="panel">
      <div class="row">
        <button id="pull" class="kafka" type="button">Fetch / Pull</button>
        <button id="clear" class="secondary" type="button">Clear list</button>
      </div>
      <div id="status" class="status">Idle — click Fetch when ready.</div>
      <ul id="feed" class="feed"></ul>
    </section>
    <p class="nav"><a href="/">← Home</a> · <a href="/queue-f.html">User F</a> · <a href="/queue-e1.html">User E1</a></p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const feed = document.getElementById('feed');
    function addItem(data) {
      const li = document.createElement('li');
      li.textContent = data.payload + ' · ' + data.worker + ' · p' + data.partition;
      const time = document.createElement('time');
      time.textContent = data.occurredAt || new Date().toISOString();
      li.appendChild(time);
      feed.prepend(li);
    }
    document.getElementById('clear').addEventListener('click', () => {
      feed.innerHTML = '';
      statusEl.className = 'status';
      statusEl.textContent = 'List cleared.';
    });
    document.getElementById('pull').addEventListener('click', async () => {
      statusEl.className = 'status';
      statusEl.textContent = 'Pulling…';
      try {
        const res = await fetch('/api/v1/demo/queue/pull');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const body = await res.json();
        const messages = body.messages || [];
        messages.forEach(addItem);
        statusEl.className = 'status ok';
        statusEl.textContent = messages.length
          ? 'Pulled ' + messages.length + ' task(s) from worker-2.'
          : 'No new tasks for worker-2.';
      } catch (e) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Failed: ' + e.message;
      }
    });
  </script>
</body>
</html>
