<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User A — Words</title>
  <link rel="stylesheet" href="/css/demo.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge rabbit">RabbitMQ-style · Producer</span>
      <h1>User A</h1>
      <p>Type words and submit. User B should receive them automatically.</p>
    </header>

    <section class="panel">
      <label for="words">Words</label>
      <textarea id="words" placeholder="Hello from User A"></textarea>
      <div class="row">
        <button id="send" type="button">Submit</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <p class="nav"><a href="/">← Home</a> · <a href="/rabbit-b.html">B</a> · <a href="/rabbit-b1.html">B1</a> · <a href="/rabbit-b2.html">B2</a></p>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    document.getElementById('send').addEventListener('click', async () => {
      const words = document.getElementById('words').value.trim();
      if (!words) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Please enter some words.';
        return;
      }
      statusEl.className = 'status';
      statusEl.textContent = 'Sending…';
      try {
        const res = await fetch('/api/v1/demo/rabbit/words', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const body = await res.json();
        statusEl.className = 'status ok';
        statusEl.textContent = 'Accepted · eventId=' + body.eventId;
        document.getElementById('words').value = '';
      } catch (e) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Failed: ' + e.message;
      }
    });
  </script>
</body>
</html>
