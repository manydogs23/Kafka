server:
  port: 8080

spring:
  application:
    name: kafka-messaging-patterns

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Boot 4 / Spring Kafka 4: use Jackson 3 serializers (tools.jackson).
      # The old JsonSerializer needs Jackson 2 (com.fasterxml) and fails at
      # runtime with ClassNotFoundException: ...databind.JavaType.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # acks=all: every produced record (queue task, broadcast, or order
      # event) is durably replicated before the send is considered complete.
      acks: all

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      # earliest: a brand-new consumer group (e.g. the first time
      # group-analytics or group-notifications ever connects) starts reading
      # from the beginning of the topic instead of only seeing new messages.
      auto-offset-reset: earliest
      properties:
        # The same JacksonJsonDeserializer is shared across topics whose values
        # are different DTO types (TaskMessage / BroadcastMessage / OrderEvent).
        # JacksonJsonSerializer stamps the concrete type into record headers on
        # the producer side, so the deserializer resolves the right class per
        # record automatically -- trusted.packages just allow-lists which
        # classes it's willing to instantiate.
        spring.json.trusted.packages: "*"

    listener:
      # BATCH ack-mode is the default used by the auto-configured
      # kafkaListenerContainerFactory, i.e. the two RabbitMQ-style patterns
      # below (task-queue-topic, broadcast-topic). The order-events-topic
      # listener overrides this with its own MANUAL-ack factory (see
      # KafkaConsumerConfig) to demonstrate log-style, commit-after-apply
      # processing.
      ack-mode: batch

logging:
  level:
    com.example.kafkapatterns: INFO
    org.apache.kafka: WARN

# --------------------------------------------------------------------------
# Pattern-to-config cheat sheet
# --------------------------------------------------------------------------
# 1) RabbitMQ-style WORK QUEUE      -> topic: task-queue-topic
#      - 3 partitions (see KafkaTopicConfig)
#      - Both @KafkaListener methods in QueueWorkerListener use
#        groupId=worker-group -> Kafka load-balances partitions between
#        them, so each task is handled by exactly ONE worker instance.
#
# 2) RabbitMQ-style PUB/SUB FANOUT  -> topic: broadcast-topic
#      - FanoutListener has two listeners with DIFFERENT groupIds
#        (group-analytics, group-notifications) -> each group gets its own
#        full copy of every message, independent of the other's progress.
#
# 3) Kafka-native EVENT LOG         -> topic: order-events-topic
#      - Infinite retention (retention.ms=-1) so the log is always
#        replayable.
#      - Messages are keyed by orderId to preserve per-order ordering
#        within a partition.
#      - OrderEventListener uses manual ack (commit-after-apply).
#      - OrderEventReplayService rewinds to offset 0 with a disposable
#        consumer group to rebuild state on demand (GET
#        /api/v1/kafka/stream/replay).
