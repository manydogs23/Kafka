<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User F — Tasks</title>
  <link rel="stylesheet" href="/css/demo.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge rabbit">Work queue · Producer</span>
      <h1>User F</h1>
      <p>Submit a task. Exactly one of E1 or E2 will get it (competing worker-group).</p>
    </header>
    <section class="panel">
      <label for="payload">Task payload</label>
      <textarea id="payload" placeholder="Do something useful"></textarea>
      <div class="row">
        <button id="send" type="button">Submit task</button>
      </div>
      <div id="status" class="status"></div>
    </section>
    <p class="nav"><a href="/">← Home</a> · <a href="/queue-e1.html">User E1</a> · <a href="/queue-e2.html">User E2</a></p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    document.getElementById('send').addEventListener('click', async () => {
      const payload = document.getElementById('payload').value.trim();
      if (!payload) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Please enter a task payload.';
        return;
      }
      statusEl.className = 'status';
      statusEl.textContent = 'Sending…';
      try {
        const res = await fetch('/api/v1/demo/queue/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const body = await res.json();
        statusEl.className = 'status ok';
        statusEl.textContent = 'Accepted · taskId=' + body.taskId;
        document.getElementById('payload').value = '';
      } catch (e) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Failed: ' + e.message;
      }
    });
  </script>
</body>
</html>
